# Self-dogfood: run Blast Radius on this repo's own PRs.
name: Blast Radius

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          upload-sarif: "true"
